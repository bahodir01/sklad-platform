# dev-окружение: api, worker, beat, db, redis, minio (архитектура §3).
#
# worker + beat (Celery, архитектура §8) добавлены на этапе фоновых задач:
# worker исполняет очередь (PDF-прогрев, export_report, reconcile_stock,
# monthly_income_draft, db_backup), beat ставит регламентные задачи по
# расписанию. nginx (TLS-терминация) остаётся заботой prod-compose.
#
# Redis здесь redis:7-alpine — знает и RESP2, и RESP3. redis-py в проекте пиннут
# <6 (RESP2), что совместимо с Redis 7 и одновременно с Redis 5 в других средах.
# Поэтому broker/backend URL идут БЕЗ ?protocol=2 — RESP2 обеспечивает клиент.

name: sklad

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://sklad:sklad@db:5432/sklad
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      ENVIRONMENT: dev
      DEBUG: "true"
      # В dev фронт ходит по http://localhost — Secure-cookie браузер бы не отдал.
      # В prod это значение обязано быть true (ТЗ §7: HTTPS).
      REFRESH_COOKIE_SECURE: "false"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      # Живая перезагрузка кода в dev; в prod-compose тома нет.
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  # ── Celery worker (архитектура §8) ────────────────────────────────────
  # Исполняет очередь фоновых задач. Тот же образ, что api (общий код и модели),
  # но НЕ мигрирует БД и НЕ слушает HTTP — только тянет задачи из брокера.
  # Пул prefork (дефолт) годится в Linux-контейнере; --pool=solo нужен лишь на
  # Windows-dev. worker_prefetch_multiplier=1 (в celery_app) держит тяжёлые
  # задачи по одной, не набивая пачку в один процесс.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://sklad:sklad@db:5432/sklad
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      ENVIRONMENT: dev
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./backend/app:/app/app:ro
    command: >
      celery -A app.tasks.celery_app:celery_app worker
      --loglevel=INFO --concurrency=2
    restart: unless-stopped

  # ── Celery beat (архитектура §8) ──────────────────────────────────────
  # Планировщик регламентных задач: reconcile_stock (03:00), db_backup (02:00),
  # monthly_income_draft (1-е число). Ровно ОДИН экземпляр beat на кластер —
  # иначе расписание задвоится. Задачи сам НЕ исполняет, только ставит их в
  # очередь; исполняет их worker выше.
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://sklad:sklad@db:5432/sklad
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      ENVIRONMENT: dev
    volumes:
      - ./backend/app:/app/app:ro
    command: >
      celery -A app.tasks.celery_app:celery_app beat
      --loglevel=INFO --schedule /tmp/celerybeat-schedule
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sklad
      POSTGRES_PASSWORD: sklad
      POSTGRES_DB: sklad
      # C.UTF-8 — детерминированная сортировка; локаль-зависимый порядок
      # ломал бы одинаковость выдачи справочников между машинами.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sklad -d sklad"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly: refresh-сессии переживают рестарт контейнера — иначе
    # каждый деплой разлогинивал бы всех (ТЗ §7: refresh живёт 30 дней).
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Бакеты receipts/documents — приватные (ТЗ §7: чек это финансовый
  # документ, публичная ссылка недопустима). Отдача — presigned URL, TTL 5 мин.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/receipts &&
      mc mb --ignore-existing local/documents &&
      mc anonymous set none local/receipts &&
      mc anonymous set none local/documents &&
      echo 'Бакеты готовы: receipts, documents (приватные)'
      "
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
